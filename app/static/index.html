<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doc Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/ui/style.css?v=2.5">
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Marked Markdown Parser CDN -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <header>
        <div class="logo-container">
            <div class="logo-mark">
                <i data-lucide="bot" class="logo-icon"></i>
            </div>
            <h1>Doc Assistant</h1>
        </div>
        <div class="header-right">
            <button class="theme-toggle-btn" id="theme-toggle-btn" title="Toggle Light/Dark Theme">
                <i data-lucide="moon" id="theme-toggle-icon" style="width: 14px; height: 14px;"></i>
            </button>
            <div class="status-badge" id="system-status-badge">
                <span class="status-indicator" id="status-indicator-dot"></span>
                <span id="status-badge-text">System Status</span>
            </div>
        </div>
    </header>

    <main class="dashboard">
        <!-- Sidebar: Document & Session Manager -->
        <aside class="sidebar">
            <div class="sidebar-section">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                    <h2 class="section-title"><i data-lucide="message-square"></i> Conversations</h2>
                    <button class="new-chat-btn" id="new-chat-btn" title="Start New Conversation">
                        <i data-lucide="plus" style="width: 13px; height: 13px;"></i> New
                    </button>
                </div>
                <div class="session-list" id="session-list">
                    <!-- Dynamic Sessions load here -->
                    <div style="text-align: center; padding: 0.85rem; color: var(--text-muted); font-size: 0.8rem;">
                        Loading...
                    </div>
                </div>
            </div>

            <div class="sidebar-section">
                <h2 class="section-title"><i data-lucide="file-up"></i> Upload Document</h2>
                <div class="upload-container" id="upload-dropzone">
                    <i data-lucide="cloud-upload" class="upload-icon"></i>
                    <p>Drop document here</p>
                    <span>PDF, TXT, MD, HTML, CSV, JSON</span>
                    <input type="file" id="file-input" style="display: none;" accept=".pdf,.txt,.md,.html,.css,.csv,.xml,.json">
                </div>
            </div>

            <div class="sidebar-section" style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
                <h2 class="section-title"><i data-lucide="files"></i> Knowledge Base (<span id="doc-count">0</span>)</h2>
                <div class="document-list" id="doc-list">
                    <!-- Dynamic Document items load here -->
                    <div style="text-align: center; padding: 1rem; color: var(--text-muted); font-size: 0.8rem;">
                        No documents yet.
                    </div>
                </div>
            </div>
        </aside>

        <!-- Chat Console -->
        <section class="chat-container">
            <div class="messages-wrapper">
                <div class="messages-box" id="chat-box">
                    <!-- Initial Welcome Message -->
                    <div class="message assistant">
                        <div class="message-bubble">
                            Hello! I am your document assistant. Upload files in the sidebar or ask questions across your knowledge base.
                        </div>
                        <div class="message-meta">Agent • Just now</div>
                    </div>
                </div>
            </div>

            <!-- Input Panel -->
            <div class="input-panel-wrapper">
                <div class="input-panel">
                    <div class="input-options">
                        <div class="option-select-container">
                            <label for="doc-select">Search:</label>
                            <select id="doc-select">
                                <option value="">🔍 All Documents</option>
                            </select>
                        </div>
                        <button class="clear-btn" id="clear-chat-btn" title="Clear Conversation">
                            <i data-lucide="trash-2" style="width: 13px; height: 13px;"></i> Clear
                        </button>
                    </div>
                    <div class="input-box-container">
                        <input type="text" class="input-box" id="user-input" placeholder="Ask a question..." autocomplete="off">
                        <button class="send-btn" id="send-btn" title="Send message">
                            <i data-lucide="arrow-up" style="width: 18px; height: 18px;"></i>
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Toast notifications -->
    <div class="toast" id="toast-notification"></div>

    <script src="/ui/app.js?v=2.5"></script>
</body>
</html>
